name: Conformance kit

# Runs the overlay checkers and the egress twin against this repository's own overlay.
#
# The twin loads the sample egress values in the egress service's own config loaders
# and renders them with the chart, so it needs the public openddil-helm and
# openddil-demo checkouts and `helm`. It skips a test whose prerequisite is missing,
# and a run that skipped tests proved less than it says. So this job fails on any
# skipped test, and on a run that passed fewer tests than the floor below.
#
# The sibling checkouts are pinned to commit SHAs, not branches, so a change in a
# sibling cannot turn this job red or green on its own. Each pin is the head of the
# repository's default branch (master for helm and demo, main for contracts) as of
# 2026-11-10, except contracts and tactical-agents, which follow tools/init-overlay/pins.env.
# Move a pin on purpose, in a commit that says why.

on:
  push:
    branches: [ "master" ]
    paths:
      - "conformance/**"
      - "k8s/**"
      - "overlay-manifest.yaml"
      - "tests/test_overlay_manifest_parity.py"
      - "tests/test_init_overlay.py"
      - "tools/init-overlay.sh"
      - "tools/init-overlay/**"
      - "tools/hooks/**"
      - ".github/workflows/conformance-kit.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "conformance/**"
      - "k8s/**"
      - "overlay-manifest.yaml"
      - "tests/test_overlay_manifest_parity.py"
      - "tests/test_init_overlay.py"
      - "tools/init-overlay.sh"
      - "tools/init-overlay/**"
      - "tools/hooks/**"
      - ".github/workflows/conformance-kit.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      # The sibling rule in conformance/siblings.py reads this first.
      OPENDDIL_REPOS: ${{ github.workspace }}/.siblings
    steps:
      - uses: actions/checkout@v4

      # openddil-helm master as of 2026-11-10.
      - name: Check out the chart
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-helm
          ref: 8bbcb9a2fe7a80494c248d4e208511c839ccfdb5
          path: .siblings/openddil-helm

      # openddil-demo master as of 2026-11-10.
      - name: Check out the egress service
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-demo
          ref: 59b5bf78544ab763371516b2bdb79acb3c9a77b5
          path: .siblings/openddil-demo

      # openddil-contracts at CONTRACTS_REF in tools/init-overlay/pins.env: the units-table head,
      # which carries the shared unit table the harness imports. Move to the default branch once
      # the open PRs merge. Only proto/ comes with the checkout: the generated python is
      # gitignored there, so a later step generates it.
      - name: Check out the contracts
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-contracts
          ref: e63f9007aacbe952282b4e168038fd1c7e880e9c
          path: .siblings/openddil-contracts

      # openddil-tactical-agents at TA_REF in tools/init-overlay/pins.env: the algorithms-ports head.
      # Move to the default branch once the open PRs merge. The overlay's algorithm checks
      # import its edge/ harness.
      - name: Check out the algorithm harness
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-tactical-agents
          ref: e74a8d6147f71c2436bbcbc935bfcc6afe5bd306
          path: .siblings/openddil-tactical-agents

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Install
        run: pip install pytest pyyaml jsonschema protobuf asyncpg confluent-kafka grpcio-tools pint==0.24.4

      # gen/ is gitignored in openddil-contracts, so the checkout supplies only proto/.
      # Generate after the install, pinned to the installed protobuf runtime, and prove one
      # module imports before kindcheck needs it (the order openddil-tactical-agents'
      # tests.yml follows).
      - name: Generate the contracts' protobuf bindings
        run: |
          PB=$(python -c "import google.protobuf as p; print(p.__version__)")
          pip install "grpcio-tools" "protobuf==$PB"
          cd .siblings/openddil-contracts
          mkdir -p gen/python
          python -m grpc_tools.protoc --proto_path=proto --python_out=gen/python $(find proto -name '*.proto')
          echo "generated $(find gen/python -name '*_pb2.py' | wc -l) protobuf modules"
          PYTHONPATH=gen/python python -c "from openddil.configuration.v1 import as_maintained_pb2"

      - name: Overlay checkers and the manifest parity test
        run: python -m pytest conformance/overlay/tests tests/test_overlay_manifest_parity.py -q

      - name: Egress twin, with no skips
        run: |
          set -o pipefail
          python -m pytest conformance/egress-twin -q -rs | tee twin.out
          summary="$(tail -n 1 twin.out)"
          echo "$summary"
          if echo "$summary" | grep -Eq '[0-9]+ (skipped|failed|error)'; then
            echo "::error::the twin skipped, failed or errored: $summary" >&2
            exit 1
          fi
          passed="$(echo "$summary" | sed -n 's/^\([0-9]*\) passed.*/\1/p')"
          if [ -z "$passed" ] || [ "$passed" -lt 8 ]; then
            echo "::error::the twin passed ${passed:-0} tests; the floor is 8, so it checked less than it should" >&2
            exit 1
          fi

      - name: kindcheck on the public fixtures
        run: |
          set -o pipefail
          F=conformance/kindcheck/fixtures
          python conformance/kindcheck/kindcheck.py \
            --assembler-config $F/assembler-config.json --schemas $F/kind-schemas \
            --cm-state $F/cm-state.json --asset $F/asset.json \
            --now 2026-11-07T12:00:00Z | tee kindcheck.out
          line="$(tail -n 1 kindcheck.out)"
          if [ "$line" != "kindcheck: checked=1 pass=1 fail=0 unchecked=0" ]; then
            echo "::error::kindcheck summary was: $line" >&2
            exit 1
          fi
          python -m pytest conformance/kindcheck -q

      # The skeleton init-overlay writes must pass its own ten checks as it comes. The test
      # makes a repo in a temp dir, runs checks.sh in it, and asserts the summary line. It
      # needs helm, the demo, the contracts bindings and the harness, all checked out above.
      - name: init-overlay skeleton passes its checks
        run: |
          set -o pipefail
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          python -m pytest tests/test_init_overlay.py -q -rs -p no:cacheprovider | tee init.out
          summary="$(tail -n 1 init.out)"
          if echo "$summary" | grep -Eq '[0-9]+ (skipped|failed|error)' || ! echo "$summary" | grep -Eq '^3 passed'; then
            echo "::error::init-overlay test summary was: $summary" >&2
            exit 1
          fi

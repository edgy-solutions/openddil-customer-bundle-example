# =============================================================================
# Deployment-overlay artifact manifest
# =============================================================================
# THE PUBLIC CONTRACT for what a deployment overlay consists of.
#
# OpenDDIL's open core meets closed worlds at the overlay seam: the core ships
# mechanisms, an overlay supplies the deployment-specific content those
# mechanisms execute. Real overlays are private by necessity — they carry
# proprietary wire shapes, controlled-spec definitions, national procedures.
#
# That creates a credibility problem this file exists to solve. If the only
# instantiations of the seam are invisible, then:
#   * CI cannot exercise the overlay mechanism at all;
#   * worked-example pedagogy points at things its audience cannot open;
#   * test harnesses invent throwaway fixtures per run.
#
# So THIS bundle is the public twin: structurally isomorphic to a real
# deployment overlay, with entirely fictional content. The rule
# (openddil-contracts/decisions/PRINCIPLES.md §"Public twin, declared by
# manifest") is:
#
#     Any artifact class a deployment overlay carries must have a sanitized
#     twin here. Structure mirrors; content is fictional.
#
# And the check is deliberately expressible WITHOUT reference to any private
# material:
#
#     sample overlay  ⊇  this manifest
#
# which runs anywhere — including CI, where private overlays do not exist.
# Content parity is neither possible nor desired: this bundle's content is
# invented by design.
#
# CONTENT RULES for anything added here:
#   * Fictional sites, fictional asset identifiers, fictional platform names.
#   * FICTIONAL NATIONS. Releasability work (ADR-0029) demonstrates
#     cross-national access control; doing that publicly requires invented
#     national labels so the mechanism is provable with zero real labels
#     involved. Use clearly-invented codes.
#   * Never copy content from a real deployment. Mirror its SHAPE.
# =============================================================================

version: 1

classes:

  # --- present today ---------------------------------------------------------

  - id: connect
    purpose: >
      Redpanda Connect pipeline definitions binding a deployment's transports
      (AMQP, HTTP, file) to OpenDDIL ingress topics.
    path: connect/
    required: true
    status: present

  - id: ingress-mappings
    purpose: >
      Bloblang mappings translating a source's raw JSON into the Silver
      ontology — identity aliasing, platform_variant resolution, kinematics,
      OperationalState decomposition, provenance stamping (ADR-0030 Stage 2).
    path: dynamic-mappings/
    required: true
    status: present
    notes: >
      This is the class ADR-0030 designates as the worked example for adapter
      authors. It is therefore the highest-value entry in this manifest: the
      pedagogy is only as good as the public specimen.

  - id: egress-mappings
    purpose: >
      Outbound mappings projecting OpenDDIL state into a consuming system's
      vocabulary (e.g. readiness-vocabulary swaps).
    path: dynamic-mappings/egress/
    required: false
    status: present

  - id: ontology-overlay
    purpose: >
      Deployment-specific identity aliases and platform_variant aliases
      (ADR-0015, ADR-0016).
    path: ontology/
    required: true
    status: present

  - id: integration-tests
    purpose: >
      Tests proving the overlay's mappings and pipelines behave against the
      core — the public seam's CI surface.
    path: tests/
    required: true
    status: present

  - id: compose-profile
    purpose: >
      Compose overlay layering the deployment's services onto the OSS demo
      stack.
    path: docker-compose.customer.yml
    required: true
    status: present

  # --- declared, not yet twinned --------------------------------------------
  # Each of these is an artifact class the seam is known to carry. Absence
  # here is a parity gap, not an argument that the class does not exist.

  - id: cm-baselines
    purpose: >
      ConfigurationBaseline definitions per platform variant — what compliance
      MEANS for a platform (installed-CI slots, required modifications).
      Versioned reference data distributed to tiers (ADR-0032 §c passenger 5).
    path: baselines/
    required: true
    status: present
    notes: >
      Load-bearing, not decoration: a tier's cm-service produces meaningless
      output without baselines mounted. Discovered by the Arc 1 Phase 3 gate.

  - id: wire-schemas
    purpose: >
      Schema documents describing a source's wire shape, plus routing-key and
      unit references. What a mapping is authored against.
    path: schemas/
    required: false
    status: present
    notes: >
      PROVENANCE CLASS FLIPS BETWEEN A REAL OVERLAY AND THIS TWIN, and the
      specimen must say which class it is.

      A real overlay's schema is typically a RECONSTRUCTION — inferred from
      observed traffic or from a producer's code because no contract or ICD
      was supplied. Weak provenance, real referent: it describes someone
      else's truth, imperfectly.

      This bundle's schema is AUTHORED FICTION — strong provenance,
      fictional referent. We wrote it, so it is fully definitive for the
      sample deployment it describes, and attests nothing whatsoever about
      any real-world system.

      Note the inversion: the twin is MORE authoritative than the original,
      about LESS. So the specimen's header must make two claims, not one:
        1. "Authored for the sample deployment; definitive for it."
        2. "Demonstrates the mapping pattern. Does NOT attest that any
            real-world schema was validated."

      Stating only "this is a sample" would launder the distinction —
      readers would infer that real overlays' schemas carry the same
      authority this one does, which is exactly backwards
      (PRINCIPLES §Claims vs. sources).

  - id: chart-overlay
    purpose: >
      Helm chart overlay layering deployment services onto the OSS chart —
      the Kubernetes counterpart of the compose profile.
    path: chart/
    required: false
    status: MISSING
    travels_with: deferred
    notes: >
      DELIBERATELY still open after Phase 3, with the reason recorded rather
      than left as an unexplained gap.

      Phase 3's validation need is met by the `deployment-manifests` class: a
      values overlay the tier-node template is rendered against. A CHART
      overlay is a different artifact — it packages a deployment's OWN
      services on top of the OSS chart — and nothing in Phase 3 exercises it,
      so building one now would be a fixture with no test behind it.

      It lands when a sample-deployment service actually needs packaging.
      Until then this row says "known, not forgotten".

  - id: deployment-manifests
    purpose: >
      Cluster manifests and per-site deployment configuration (site topology,
      node/tier assignment, environment values).
    path: k8s/
    required: false
    status: present

  - id: mapping-unit-tests
    purpose: >
      Bloblang-level unit tests for the ingress mappings, distinct from
      end-to-end integration tests.
    path: tests/bloblang/
    required: false
    status: MISSING
    travels_with: repoint-motion

  # --- prospective ------------------------------------------------------------
  # Classes the architecture has designated but which do not exist in any
  # overlay yet. Listed so the manifest stays the single home for the answer
  # to "what does an overlay carry?" as the seam grows.

  - id: policy-corpus
    purpose: >
      Asserted entitlements and policy content for the deployment's local
      authorizers — subject attributes, releasability rules (ADR-0029).
    path: policy/
    required: false
    status: PROSPECTIVE
    notes: >
      Requires fictional nations. This class is what makes a public
      cross-national releasability demonstration possible in CI.

  - id: workflow-definitions
    purpose: >
      Sovereignty-specific maintainer process workflows — a deployment's own
      inspection / sign-off / requisition procedures (ADR-0034 §The two
      planes).
    path: workflows/
    required: false
    status: PROSPECTIVE

  - id: format-definitions
    purpose: >
      Binary-format grammars or middleware participant configs for
      controlled-spec ingress the OSS core cannot ship (ADR-0030 §Controlled-
      spec formats, §Ingress classes).
    path: formats/
    required: false
    status: PROSPECTIVE

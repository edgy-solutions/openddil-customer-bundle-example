# =============================================================================
# Sample ingress mapping — WORKED EXAMPLE for adapter authors
# =============================================================================
# This is the public specimen ADR-0030 designates as the reference for anyone
# writing a new ingress mapping. It maps the fictional SENTRY-series sensor
# (schemas/sample_sensor_message.schema.json) into the OpenDDIL Silver
# ontology.
#
# EVERYTHING HERE IS FICTIONAL — nations, sites, asset identifiers, platform
# designations. The SHAPE is real; the content is invented (see
# overlay-manifest.yaml).
#
# The four disciplines this file demonstrates, each with an ADR behind it:
#
#   1. IDENTITY (ADR-0015)  — native id -> canonical asset_id, scheme-prefixed.
#   2. VARIANT   (ADR-0016) — native platform_type -> canonical platform_variant
#                             via the alias map. NEVER hardcoded here.
#   3. UNITS     (ADR-0013) — carry the source's native unit verbatim as a
#                             Quantity. NO MATH IN THE MAPPING.
#   4. STATE     (ADR-0026) — decompose the source's COMBINED state enum into
#                             three orthogonal axes. This is the centrepiece.
#
# Plus provenance stamping, including releasability labels (ADR-0029).
#
# WHAT DOES NOT BELONG HERE (ADR-0030 boundary statement):
#   Bloblang maps STRUCTURED data to the ontology. It does not decode binary
#   grammars. If your source is a packed binary wire format, you need a
#   decoder sidecar in front of this, not more Bloblang.
# =============================================================================

processor_resources:
  - label: sample_sensor_mapping
    mapping: |
      # ---------------------------------------------------------------------
      # 1. IDENTITY — ADR-0015
      # ---------------------------------------------------------------------
      # Canonical asset_id is scheme-prefixed so downstream joins never have
      # to guess which producer an id came from. The prefix is a namespace
      # marker, not decoration: two sources may legitimately use the same
      # native id for different assets.
      root.asset.asset_id = "sample:" + this.sensor_id
      root.asset.callsign = this.callsign | ""

      # ---------------------------------------------------------------------
      # 2. PLATFORM VARIANT — ADR-0016
      # ---------------------------------------------------------------------
      # Resolved through the alias map (ontology/platform_variant_aliases.yaml),
      # NOT hardcoded here. A new native designation is an ontology PR, not a
      # mapping change — which is the whole point of the split.
      #
      # Passthrough on miss: an unaliased variant flows through unchanged and
      # the ontology-drift check flags it, rather than the mapping silently
      # inventing a canonical name.
      let variant_alias = {
        "SENTRY_MK3":     "MRAD_Sensor",
        "SENTRY_MK3_EXT": "MRAD_ADVANCED_Sensor"
      }
      root.asset.platform_variant = $variant_alias.get(this.platform_type) | this.platform_type

      # ---------------------------------------------------------------------
      # 3. KINEMATICS + UNITS — ADR-0013
      # ---------------------------------------------------------------------
      # Tag each scalar with the SOURCE's native unit and let pint convert
      # downstream. Do not normalise here; a mapping that converts units is a
      # mapping that has started doing algorithms.
      root.kinematics.position.wgs84.lat = this.position.lat_deg
      root.kinematics.position.wgs84.lon = this.position.lon_deg
      root.kinematics.position.wgs84.alt = {
        "unit":  "m",
        "value": this.position.alt_m | 0
      }

      # ---------------------------------------------------------------------
      # 4. OPERATIONAL STATE — ADR-0026  *** THE CENTREPIECE ***
      # ---------------------------------------------------------------------
      # The source collapses power, activity and health into ONE enum. The
      # canonical model keeps them as three ORTHOGONAL axes, because they are
      # genuinely independent: an asset can be powered on, in an active mode,
      # AND degraded — simultaneously. A combined enum cannot express that
      # without a cross-product explosion.
      #
      # Read the three match blocks as three independent questions asked of
      # the same input:
      #
      #     POWER  — is it energised at all?
      #     MODE   — what is it doing right now?
      #     HEALTH — is it nominal or impaired?
      #
      # A different source with a different combined vocabulary writes its own
      # three match blocks. The Silver shape never changes — which is what lets
      # the UI, fusion and rollups stay source-agnostic.

      # --- ENUMERATE, DO NOT CATCH-ALL -------------------------------------
      # Every branch below lists a mode the source schema DECLARES. The final
      # `_` is reached only by a value the schema does not declare — a new
      # mode, a typo, a version skew — and it yields UNSPECIFIED.
      #
      # This is the difference between a RESIDUAL CLASS and an UNRECOGNISED
      # INPUT, and they are easy to conflate because they share syntax.
      # "Everything else is powered on" is a real modelling decision about a
      # nameable set. "Anything at all, including values that do not exist
      # yet, is powered on and healthy" is not a decision — it is an
      # assertion made on the basis of not understanding the input.
      #
      # The earlier form ended each axis with a catch-all, so an unknown mode
      # resolved to POWER_ON / ACTIVE / NOMINAL: the system asserting an
      # asset is healthy precisely because it failed to recognise its state.
      # A false negative on the safety-relevant axis.
      #
      # Test: can you NAME what falls into this branch? If the answer is
      # "anything", it is not a residual class.

      # --- axis 1: power ---------------------------------------------------
      root.operational_state.power_state = match this.mode {
        this == "OFF"            => "POWER_STATE_OFF",
        this == "STARTING"       => "POWER_STATE_STARTING",
        this == "SHUTTING_DOWN"  => "POWER_STATE_SHUTTING_DOWN",
        this == "MAINTENANCE"    => "POWER_STATE_MAINTENANCE",
        this == "STANDBY"        => "POWER_STATE_ON",
        this == "ACTIVE"         => "POWER_STATE_ON",
        this == "ACTIVE_RX_ONLY" => "POWER_STATE_ON",
        this == "ACTIVE_TX_ONLY" => "POWER_STATE_ON",
        this == "DEGRADED"       => "POWER_STATE_ON",
        this == "FAULT"          => "POWER_STATE_ON",
        _                        => "POWER_STATE_UNSPECIFIED"
      }

      # --- axis 2: functional mode -----------------------------------------
      # NOTE the deliberate asymmetry: DEGRADED and FAULT say nothing about
      # WHAT the sensor is doing, only about how well. They therefore map to
      # ACTIVE here and carry their signal on the health axis. Folding them
      # into mode would lose the distinction between "impaired but working"
      # and "idle".
      root.operational_state.functional_mode = match this.mode {
        this == "OFF"            => "FUNCTIONAL_MODE_UNSPECIFIED",
        this == "STANDBY"        => "FUNCTIONAL_MODE_STANDBY",
        this == "ACTIVE_RX_ONLY" => "FUNCTIONAL_MODE_RECEIVE_ONLY",
        this == "ACTIVE_TX_ONLY" => "FUNCTIONAL_MODE_TRANSMIT_ONLY",
        this == "MAINTENANCE"    => "FUNCTIONAL_MODE_MAINTENANCE",
        this == "ACTIVE"         => "FUNCTIONAL_MODE_ACTIVE",
        this == "DEGRADED"       => "FUNCTIONAL_MODE_ACTIVE",
        this == "FAULT"          => "FUNCTIONAL_MODE_ACTIVE",
        # STARTING and SHUTTING_DOWN resolved to ACTIVE under the previous
        # catch-all. Preserved verbatim rather than corrected here — this
        # change is about unrecognised input, not about re-deciding declared
        # modes. Whether a starting or stopping sensor is meaningfully
        # "ACTIVE" is a separate question, deliberately left open.
        this == "STARTING"       => "FUNCTIONAL_MODE_ACTIVE",
        this == "SHUTTING_DOWN"  => "FUNCTIONAL_MODE_ACTIVE",
        _                        => "FUNCTIONAL_MODE_UNSPECIFIED"
      }

      # --- axis 3: health ---------------------------------------------------
      # THE SAFETY-RELEVANT AXIS. An unrecognised mode must never resolve to
      # NOMINAL: that is the system claiming an asset is healthy on the
      # basis of not understanding it — a false negative on exactly the
      # axis where false negatives matter (ADR-0036).
      root.operational_state.health_state = match this.mode {
        this == "DEGRADED"       => "HEALTH_STATE_DEGRADED",
        this == "FAULT"          => "HEALTH_STATE_FAULT",
        this == "OFF"            => "HEALTH_STATE_NOMINAL",
        this == "STARTING"       => "HEALTH_STATE_NOMINAL",
        this == "STANDBY"        => "HEALTH_STATE_NOMINAL",
        this == "ACTIVE"         => "HEALTH_STATE_NOMINAL",
        this == "ACTIVE_RX_ONLY" => "HEALTH_STATE_NOMINAL",
        this == "ACTIVE_TX_ONLY" => "HEALTH_STATE_NOMINAL",
        this == "MAINTENANCE"    => "HEALTH_STATE_NOMINAL",
        this == "SHUTTING_DOWN"  => "HEALTH_STATE_NOMINAL",
        _                        => "HEALTH_STATE_UNSPECIFIED"
      }

      # --- discrete activity cues -------------------------------------------
      # Separate booleans rather than more enum values: "is the RX path live"
      # is a different question from "what mode is it in", and consumers ask
      # them independently.
      #
      # A boolean has no UNSPECIFIED to fall back to, which makes the
      # enumerate-do-not-catch-all rule MORE important here, not less: every
      # possible value of a bool is a positive claim. `false` is not a
      # refusal — it asserts "this sensor is not receiving", which is just as
      # unfounded for an unrecognised mode as `true` would be.
      #
      # So unknown modes DELETE the field. Absent means "not claimed", and a
      # consumer that needs to know can tell absent from either answer.
      root.operational_state.actively_receiving = match this.mode {
        this == "OFF" || this == "STANDBY" || this == "ACTIVE_TX_ONLY" ||
        this == "SHUTTING_DOWN" || this == "MAINTENANCE" => false,
        this == "ACTIVE" || this == "ACTIVE_RX_ONLY" ||
        this == "DEGRADED" || this == "FAULT" || this == "STARTING" => true,
        _ => deleted()
      }
      root.operational_state.actively_transmitting = match this.mode {
        this == "OFF" || this == "STANDBY" || this == "ACTIVE_RX_ONLY" ||
        this == "SHUTTING_DOWN" || this == "MAINTENANCE" => false,
        this == "ACTIVE" || this == "ACTIVE_TX_ONLY" ||
        this == "DEGRADED" || this == "FAULT" || this == "STARTING" => true,
        _ => deleted()
      }

      # ---------------------------------------------------------------------
      # 5. PROVENANCE — ADR-0022 / ADR-0023 / ADR-0029
      # ---------------------------------------------------------------------
      root.provenance.producer_id      = "sample-sensor-adapter"
      root.provenance.source_protocol  = "sample/amqp-json"
      root.provenance.source_sequence  = this.sequence | 0
      root.provenance.sample_time      = this.reported_at

      # ======================================================================
      # ⚠ DO NOT COPY THE NEXT TWO LINES INTO A WORKING ADAPTER — NOT YET.
      # ======================================================================
      # THEY DO NOT ENCODE. `Provenance` does not declare `originator_nation`
      # or `releasable_to` today. Both are an ADR-0029 Phase 0 deliverable
      # that has not landed: the fields exist in Postgres columns and in the
      # ADR, and in NO .proto file.
      #
      # The real ingress encodes mapping output with
      #     protobuf: operator: from_json, message: EntityTelemetryEvent
      # and protojson REJECTS unknown fields. Verified 2026-08-12, not
      # assumed — the encoder returns:
      #
      #     unmarshalling JSON message
      #     'openddil.telemetry.v1.EntityTelemetryEvent':
      #     proto: (line 1:54): unknown field "originator_nation"
      #
      # That step sits inside a `try:` whose `catch:` routes to `ingress-dlq`.
      # So an adapter that copies this block today does not lose two fields —
      # IT SENDS 100% OF ITS TRAFFIC TO THE DEAD-LETTER QUEUE, attributed to
      # a stage name that names two possible causes. Total ingress failure
      # for that source, from two lines that look like the rest of the file.
      #
      # They are kept, not deleted, because this specimen deliberately shows
      # the TARGET shape and ADR-0029 Phase 0 is what makes it real. When the
      # proto captures land, delete this banner and nothing else.
      #
      # This warning exists because the file is copied. Nothing else in it is
      # unencodable, so there is no local signal that these two lines differ
      # from their neighbours — which is precisely the property that makes a
      # reference specimen dangerous when it runs ahead of its contract.
      # (ADR-0017's rule, applied to a mapping: an artifact that is ahead of
      # what it claims must SAY so rather than teach silently.)
      #
      # A second reason not to copy this verbatim, independent of encoding:
      # `originator_nation` here is PARSED FROM AN ID NAMING CONVENTION
      # (<NATION>_<SITE>_...). That is inference from a naming habit, not a
      # declaration by the producer, and releasability is the worst possible
      # place to inherit an inference by default — ADR-0029 §7's whole gate
      # rests on telling "not labelled" apart from "labelled by guess".
      # Legitimate here ONLY as a stated, signed local assumption of the
      # sample deployment. A real deployment answers "what DECLARES
      # nationality?" before writing this line. See
      # PLAN-arc2-slice1-opening-package.md §5 step 2 and the ladder in
      # DESIGN-2026-08-11-declared-asset-class.md.
      #
      # A deployment whose ids do NOT encode nationality needs a real mapping
      # source; the config default is honest about being a default, not a
      # derivation.
      root.provenance.originator_nation = this.sensor_id.split("_").index(0) | "UNKNOWN"
      root.provenance.releasable_to     = this.releasable_to | []

      # ---------------------------------------------------------------------
      # 6. WHAT WE DELIBERATELY DO NOT MAP
      # ---------------------------------------------------------------------
      # subsystems[] is carried to Bronze but not interpreted here. Turning
      # subsystem health into severity is fusion's job (ADR-0020 / ADR-0026
      # constraining factors), not the mapping's. A mapping that computes
      # severity has started doing algorithms — the same boundary violation
      # as converting units.

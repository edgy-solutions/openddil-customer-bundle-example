# Golden-file harness — runs ONE mapping over stdin and prints the result.
#
# Deliberately minimal: stdin -> the mapping under test -> stdout. No broker,
# no schema registry, no network. The mapping resource file is supplied with
# `-r` at run time, so this harness is mapping-agnostic and the same file
# tests every mapping the overlay ships.
#
# WHY GOLDEN FILES AND NOT `connect test`:
# Redpanda Connect's `test` subcommand was verified NOT to exist in the
# pinned distribution — checked, not assumed. Golden-file diffing needs
# nothing but the binary itself.
#
# ⚠ THIS SUITE TESTS ONE LAYER ABOVE THE ONE THAT CAN FAIL — AND THE LAYER
# BELOW IT IS NOW COVERED SEPARATELY.
# This file runs JSON -> mapping -> JSON and NEVER ENCODES TO PROTOBUF. The
# real ingress does (`protobuf: operator: from_json`), and protojson rejects
# both unknown fields and wrongly-shaped ones.
#
# That gap was not hypothetical. It hid TWO unrelated encode defects in the
# specimen at once, for different reasons and different lengths of time:
#
#   1. `provenance.originator_nation` / `releasable_to` — fields the proto
#      did not declare until ADR-0029 Phase 0 (2026-09-04). Ahead of its
#      contract; the file said so in a banner.
#   2. `kinematics.position.wgs84.lat` / `lon` as bare numbers where
#      `Wgs84Position` declares `Quantity`. NOT ahead of any contract —
#      simply wrong, for as long as the file existed, against a contract
#      that never changed. Nothing said so, because nothing could.
#
# Every golden here pinned both and PASSED. A golden file records what a
# mapping PRODUCES; it says nothing about whether the consumer can ACCEPT
# it. Green here was never green on the wire.
#
# CLOSED by run.sh's conformance stage (see conformance.yaml), which encodes
# each case's output through the real ingress's own step. It caught defect 2
# on its first run. This header is kept rather than deleted because the
# scope statement is still true — this file's own coverage ends at JSON —
# and because the two defects are the argument for why the stage exists.
#
# WHY THIS MAPPING IS SAFE TO GOLDEN-FILE:
# sample-sensor-mapping.yaml is fully deterministic — every output field
# derives from an input field. It generates no uuid, reads no clock. A
# mapping that did either would need those fields masked before diffing, and
# that masking would have to be written and justified per mapping rather than
# assumed.

input:
  stdin:
    codec: lines

pipeline:
  processors:
    - resource: sample_sensor_mapping

output:
  stdout:
    codec: lines
